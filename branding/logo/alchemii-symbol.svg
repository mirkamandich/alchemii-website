<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="AlchemII symbol">
  <!--
    AlchemII symbol — parametric rebuild of the original mark.
    Elements: lab flask (single-pot chemistry) + hexagon (carbon / graphite
    lattice) + circle (atom / hydrogen) + triangle, stitched by solid nodes
    at the intersections (a molecular graph). Monoline; recolor via `color`
    (everything is currentColor). Tune any coordinate to nudge the balance.
  -->
  <g fill="none" stroke="currentColor" stroke-width="5"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- Flask: closed-rim neck + conical body -->
    <path d="M52 3 L93 3 L93 83 L120 177 L25 177 L52 83 Z"/>
    <!-- Hexagon (flat-top, pointed sides), top edge meeting the flask shoulders -->
    <path d="M100 124 L77 83 L30 83 L6 124 L30 165 L77 165 Z"/>
    <!-- Circle, overlapping the neck -->
    <circle cx="138" cy="74" r="60"/>
    <!-- Triangle, apex on the circle -->
    <path d="M123 131 L176 178 L84 178 Z"/>
  </g>
  <!-- Nodes at the key intersections -->
  <g fill="currentColor">
    <circle cx="74" cy="83" r="9"/>
    <circle cx="123" cy="131" r="9"/>
  </g>
</svg>
